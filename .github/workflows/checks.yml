name: Check Windows and Linux

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to verify
        required: true
        default: v1.1.0
        type: string

permissions:
  contents: read

jobs:
  source:
    name: Source tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - name: Install Linux desktop graphics libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0
      - run: python -m pip install -r requirements-tested.txt pytest
      - run: python -m pytest tests -q

  windows-portable:
    name: Released Windows portable ZIP
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Download and verify the release
        shell: pwsh
        run: |
          $downloads = Join-Path $env:RUNNER_TEMP 'downloads'
          New-Item -ItemType Directory -Path $downloads | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir $downloads --pattern Monomoon-Translator-Windows-x64.zip --pattern Monomoon-Translator-SHA256SUMS.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
          $zip = Join-Path $downloads 'Monomoon-Translator-Windows-x64.zip'
          $sums = Get-Content (Join-Path $downloads 'Monomoon-Translator-SHA256SUMS.txt')
          $entry = $sums | Where-Object { $_ -match '  Monomoon-Translator-Windows-x64.zip$' }
          if (-not $entry) { throw 'Missing Windows checksum' }
          $expected = ($entry -split '\s+')[0]
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $expected) { throw 'ZIP checksum mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'Monomoon portable é'
          Expand-Archive -LiteralPath $zip -DestinationPath $destination
          "MONOMOON_TEST_APP=$destination\Monomoon Translator" >> $env:GITHUB_ENV
      - name: Run the actual portable launcher and bundled runtime
        shell: pwsh
        run: |
          $app = $env:MONOMOON_TEST_APP
          $report = Join-Path $app 'data\logs\portable-check.json'
          $failure = Join-Path $app 'data\logs\portable-check-failure.txt'
          $log = Join-Path $app 'data\logs\app.log'
          Start-Process -FilePath (Join-Path $app 'Monomoon Translator.exe') -ArgumentList '--self-test' -WorkingDirectory $env:RUNNER_TEMP
          $deadline = (Get-Date).AddMinutes(3)
          while (-not (Test-Path $report) -and -not (Test-Path $failure) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
          }
          if (Test-Path $log) { Get-Content $log }
          if (Test-Path $failure) { Get-Content $failure; throw 'Portable runtime check failed' }
          if (-not (Test-Path $report)) { throw 'Portable launcher did not produce a report' }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          Get-Content $report
          if (-not $result.success -or $result.platform -ne 'win32') { throw 'Invalid portable runtime result' }
          if ($env:RELEASE_TAG -eq 'v1.1.0' -and (-not $result.symbols -or $result.profile_format -ne 2)) { throw 'Missing number/punctuation checks' }
      - name: Preserve portable check results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows-portable-check
          path: ${{ runner.temp }}/Monomoon portable é/Monomoon Translator/data/logs/
